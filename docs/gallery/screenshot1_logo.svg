<svg xmlns="http://www.w3.org/2000/svg" width="600" height="180" viewBox="0 0 600 180">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#151d30"/>
    </linearGradient>
    <linearGradient id="redTrack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="blueTrack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="greenTrack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="goldArch" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="180" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Logo Mark: Stylized Charminar & 3 Dynamic Metro Corridors -->
  <g transform="translate(30, 20)">
    <!-- Shield / Glow Backdrop -->
    <circle cx="70" cy="70" r="65" fill="#1e293b" fill-opacity="0.6"/>

    <!-- Charminar Iconic Silhouette Arch (Golden Heritage) -->
    <!-- Central Arch -->
    <path d="M 45 105 L 45 70 Q 45 42 70 42 Q 95 42 95 70 L 95 105" fill="none" stroke="url(#goldArch)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Minaret Left -->
    <line x1="32" y1="110" x2="32" y2="48" stroke="url(#goldArch)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="32" cy="44" r="4" fill="#fde047"/>
    <!-- Minaret Right -->
    <line x1="108" y1="110" x2="108" y2="48" stroke="url(#goldArch)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="108" cy="44" r="4" fill="#fde047"/>
    <!-- Cross Balcony Gallery -->
    <line x1="28" y1="62" x2="112" y2="62" stroke="url(#goldArch)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Dynamic Metro Speedlines (Corridor 1: Red, Corridor 2: Green, Corridor 3: Blue) -->
    <!-- Red Line: Miyapur - LB Nagar -->
    <path d="M 15 125 C 40 125 55 95 95 75 C 115 65 135 68 150 72" fill="none" stroke="url(#redTrack)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
    <!-- Blue Line: Nagole - Raidurg -->
    <path d="M 10 100 C 45 100 65 115 100 115 C 125 115 140 100 152 95" fill="none" stroke="url(#blueTrack)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
    <!-- Green Line: JBS - MGBS -->
    <path d="M 25 78 C 50 78 70 88 90 102 C 110 115 130 128 150 128" fill="none" stroke="url(#greenTrack)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>

    <!-- Station Interchange Nodes -->
    <circle cx="72" cy="98" r="4.5" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <circle cx="95" cy="75" r="4" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  </g>

  <!-- Typography & Wordmark -->
  <g transform="translate(195, 45)">
    <!-- Main Title -->
    <text x="0" y="32" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="900" fill="#f8fafc" letter-spacing="2">
      HYDERABAD
    </text>
    <text x="0" y="64" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#38bdf8" letter-spacing="4">
      METRO RAIL
    </text>

    <!-- Subtitle Pill / Badge -->
    <g transform="translate(0, 80)">
      <rect width="180" height="24" rx="12" fill="#0369a1" fill-opacity="0.35" stroke="#0284c7" stroke-width="1"/>
      <text x="12" y="16" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#bae6fd" letter-spacing="1.5">
        HMRL • L&amp;T METRO
      </text>
    </g>

    <!-- Corridors Legend Indicators -->
    <g transform="translate(195, 84)">
      <circle cx="8" cy="8" r="5" fill="#ef4444"/>
      <text x="18" y="12" font-family="sans-serif" font-size="10" fill="#cbd5e1">Red</text>
      <circle cx="58" cy="8" r="5" fill="#3b82f6"/>
      <text x="68" y="12" font-family="sans-serif" font-size="10" fill="#cbd5e1">Blue</text>
      <circle cx="108" cy="8" r="5" fill="#22c55e"/>
      <text x="118" y="12" font-family="sans-serif" font-size="10" fill="#cbd5e1">Green</text>
    </g>
  </g>
</svg>
